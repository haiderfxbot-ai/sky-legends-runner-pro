<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#121212">
    <meta name="description" content="Sky Legends Runner - Premium Endless Runner Adventure">
    <title>Sky Legends Runner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <div id="game-wrapper">
        <div id="game-container"></div>
        <div id="loading-overlay" class="loading-overlay">
            <div class="loading-content">
                <div class="loading-logo">
                    <h1 class="game-title">SKY LEGENDS</h1>
                    <p class="game-subtitle">RUNNER</p>
                </div>
                <div class="loading-bar-container">
                    <div class="loading-bar">
                        <div class="loading-bar-fill" id="loading-bar-fill"></div>
                    </div>
                    <p class="loading-text" id="loading-text">Initializing...</p>
                </div>
                <div class="loading-spinner">
                    <div class="spinner-ring"></div>
                </div>
            </div>
        </div>
        <div id="notification-container" class="notification-container"></div>
        <div id="modal-container" class="modal-container"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <script src="js/config/config.js"></script>
    <script src="js/utils/Constants.js"></script>
    <script src="js/utils/Helpers.js"></script>
    <script src="js/utils/ObjectPool.js"></script>
    <script src="js/managers/SaveManager.js"></script>
    <script src="js/managers/AudioManager.js"></script>
    <script src="js/managers/EventManager.js"></script>
    <script src="js/managers/UIManager.js"></script>
    <script src="js/managers/NotificationManager.js"></script>
    <script src="js/managers/AchievementManager.js"></script>
    <script src="js/managers/MissionManager.js"></script>
    <script src="js/managers/ShopManager.js"></script>
    <script src="js/managers/DailyRewardManager.js"></script>
    <script src="js/managers/PlayerProgression.js"></script>
    <script src="js/components/UIComponent.js"></script>
    <script src="js/components/Button.js"></script>
    <script src="js/components/Card.js"></script>
    <script src="js/components/Panel.js"></script>
    <script src="js/components/ProgressBar.js"></script>
    <script src="js/components/TabBar.js"></script>
    <script src="js/components/ToggleSlider.js"></script>
    <script src="js/scenes/BootScene.js"></script>
    <script src="js/scenes/LoadingScene.js"></script>
    <script src="js/scenes/SplashScene.js"></script>
    <script src="js/scenes/MainMenuScene.js"></script>
    <script src="js/scenes/ProfileScene.js"></script>
    <script src="js/scenes/RewardScene.js"></script>
    <script src="js/scenes/MissionScene.js"></script>
    <script src="js/scenes/LeaderboardScene.js"></script>
    <script src="js/scenes/SettingsScene.js"></script>
    <script src="js/scenes/ShopScene.js"></script>
    <script src="js/scenes/GameplayScene.js"></script>
    <script src="js/scenes/PauseScene.js"></script>
    <script src="js/scenes/GameOverScene.js"></script>
    <script src="js/scenes/VictoryScene.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
